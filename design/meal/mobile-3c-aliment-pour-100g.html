<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimentation – Aliment pour 100 g</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B47}a:hover{color:#14492F}
</style>
</head>
<body style="background:#F3F4EF">
<div style="width: 390px; height: 720px; box-sizing: border-box; background: #F3F4EF; color: #17201B; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="mobile-3a-nouveau-repas.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #17201B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Mon aliment</div>
    <div style="width: 44px"></div>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F; min-width: 0">Nom<input type="text" value="Jambon blanc" style="height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #17201B; box-sizing: border-box; width: 100%; min-width: 0"></label>

  <div role="group" aria-label="Valeurs" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E6E8E1; padding: 4px; border-radius: 12px">
    <button aria-pressed="true" style="height: 38px; border: none; border-radius: 9px; font: inherit; font-size: 14px; background: #FFFFFF; color: #17201B; font-weight: 600">Pour 100 g</button>
    <button aria-pressed="false" style="height: 38px; border: none; border-radius: 9px; font: inherit; font-size: 14px; background: transparent; color: #5B655F">Par portion</button>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F; min-width: 0">Calories<span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 12px; gap: 6px"><input inputmode="decimal" aria-label="Calories" value="113" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #17201B"><span style="color: #5B655F; font-size: 14px">kcal</span></span></label>
  <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F; min-width: 0">Protéines<span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 12px; gap: 6px"><input inputmode="decimal" aria-label="Protéines en grammes" value="21" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #17201B"><span style="color: #5B655F; font-size: 14px">g</span></span></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F; min-width: 0">Lipides<span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 12px; gap: 6px"><input inputmode="decimal" aria-label="Lipides en grammes" value="3" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #17201B"><span style="color: #5B655F; font-size: 14px">g</span></span></label>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F; min-width: 0">Glucides<span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 12px; gap: 6px"><input inputmode="decimal" aria-label="Glucides en grammes" value="1" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #17201B"><span style="color: #5B655F; font-size: 14px">g</span></span></label>
  </div>

  <button style="margin-top: auto; height: 52px; border-radius: 14px; border: none; background: #1E6B47; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 16px">Créer</button>
</div>
</body>
</html>
