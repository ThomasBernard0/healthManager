<body style="background:#E6E8E1">
<div style="width: 390px; height: 1060px; box-sizing: border-box; background: #F3F4EF; color: #17201B; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; gap: 14px; padding: 20px 20px 24px">

  <div style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E6E8E1; padding: 4px; border-radius: 12px">

    <a href="mobile-4-semaine.html" style="height: 36px; display: flex; align-items: center; justify-content: center; background: #FFFFFF; border-radius: 9px; font-weight: 600; font-size: 14px; color: #17201B; text-decoration: none">Semaine</a>
  </div>

        <div style="position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center">
          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; line-height: 1">1 280</div>
          <div style="font-size: 12px; color: #5B655F; margin-top: 4px; text-align: center; line-height: 1.3">kcal restantes<br>cette semaine</div>
        </div>
      </div>
      <div style="display: flex; flex-direction: column; gap: 10px; flex: 1">

          <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px">15 400</div>

    <div style="position: relative; height: 180px; display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 10px; align-items: end">
      <div style="position: absolute; left: 0; right: 0; bottom: 138px; border-top: 1.5px dashed #8A938D"></div>

      <div style="height: 114px; background: #1E6B47; border-radius: 6px 6px 2px 2px"></div>
      <div style="height: 122px; background: #1E6B47; border-radius: 6px 6px 2px 2px"></div>
      <div style="height: 156px; background: #B4510F; border-radius: 6px 6px 2px 2px"></div>

    </div>

      <div style="font-size: 12px; color: #5B655F">Moyenne / jour</div>
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px">2 017 kcal</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
      <div style="font-size: 12px; color: #5B655F">Protéines / jour</div>
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 20px">131 g</div>
    </div>
    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px">

    <div style="background: #FFFFFF; border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 2px">
