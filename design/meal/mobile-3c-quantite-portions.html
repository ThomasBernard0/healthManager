<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimentation – Quantité en portions</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B47}a:hover{color:#14492F}
</style>
</head>
<body style="background:#F3F4EF">
<div style="width: 390px; height: 760px; box-sizing: border-box; background: rgba(23, 32, 27, 0.45); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; color: #17201B; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="background: #F3F4EF; border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #C9CEC3"></div>
    <div style="display: flex; align-items: center; justify-content: space-between">
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Jambon blanc</div>
      <a href="mobile-3c-aliment-par-portion.html" aria-label="Fermer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #17201B"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
    </div>
    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F">
      Quantité
      <span style="display: flex; align-items: center; height: 64px; border-radius: 14px; border: 1.5px solid #1E6B47; background: #FFFFFF; padding: 0 16px; gap: 8px">
        <input inputmode="decimal" aria-label="Quantité de Jambon blanc" value="2" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 28px; color: #17201B">
        <span style="font-size: 16px; color: #5B655F">portions</span>
      </span>
    </label>
    <div role="radiogroup" aria-label="Unité" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; background: #E6E8E1; padding: 4px; border-radius: 12px">
      <button role="radio" aria-checked="true" style="height: 40px; border: none; border-radius: 9px; font: inherit; font-size: 14px; background: #FFFFFF; color: #17201B; font-weight: 600">En portions</button>
      <button role="radio" aria-checked="false" style="height: 40px; border: none; border-radius: 9px; font: inherit; font-size: 14px; background: transparent; color: #5B655F">En grammes</button>
    </div>
    <div style="display: flex; justify-content: space-between; align-items: baseline; background: #FFFFFF; border-radius: 14px; padding: 14px 16px">
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px">90 kcal</span>
      <span style="font-size: 14px; color: #5B655F">P 17 · L 2 · G 1</span>
    </div>
    <button style="height: 52px; border-radius: 14px; border: none; background: #1E6B47; color: #FFFFFF; font: inherit; font-weight: 600; font-size: 16px">Valider</button>
  </div>
</div>
</body>
</html>
