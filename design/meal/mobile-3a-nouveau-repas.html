<body style="background:#E6E8E1">

    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Nouveau repas</div>

    <button style="height: 38px; border: none; background: transparent; border-radius: 9px; font: inherit; font-size: 14px; color: #5B655F">Saisir les totaux</button>

  <div style="background: #FFFFFF; border-radius: 16px; padding: 6px 16px; display: flex; flex-direction: column">

      <div style="flex: 1; display: flex; flex-direction: column"><div style="font-weight: 500">Pâtes cuites</div><div style="font-size: 12px; color: #5B655F">P 13 · G 67 · L 2</div></div>
      <div style="width: 72px; height: 36px; border: 1px solid #E1E4DC; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px">220 g</div>
      <div style="width: 44px; text-align: right; font-weight: 500">348</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEF0EA">
      <div style="flex: 1; display: flex; flex-direction: column"><div style="font-weight: 500">Thon au naturel</div><div style="font-size: 12px; color: #5B655F">P 26 · G 0 · L 1</div></div>
      <div style="width: 72px; height: 36px; border: 1px solid #E1E4DC; border-radius: 9px; display: flex; align-items: center; justify-content: center; font-size: 14px">112 g</div>
      <div style="width: 44px; text-align: right; font-weight: 500">123</div>
    </div>
    <div style="display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid #EEF0EA">

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px; font-size: 13px">

    <label style="display: flex; align-items: center; justify-content: space-between; min-height: 48px">

  <a href="mobile-1-aujourdhui.html" style="height: 54px; border-radius: 14px; background: #1E6B47; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">Enregistrer et ajouter à aujourd'hui</a>
