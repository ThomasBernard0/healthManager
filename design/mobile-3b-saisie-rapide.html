<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimentation – Saisie rapide</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B47}a:hover{color:#14492F}
</style>
</head>
<body style="background:#E6E8E1">
<div style="width: 390px; height: 844px; box-sizing: border-box; background: #8F948C; color: #17201B; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; justify-content: flex-end">
  <div style="background: #F3F4EF; border-radius: 24px 24px 0 0; padding: 8px 20px 28px; display: flex; flex-direction: column; gap: 16px">
    <div style="display: flex; justify-content: center"><div style="width: 40px; height: 4px; border-radius: 2px; background: #C9CEC3"></div></div>
    <div style="display: flex; justify-content: space-between; align-items: center">
      <a href="mobile-2-ajouter-un-repas.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #17201B">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
      </a>
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Saisie rapide</div>
      <div style="width: 44px"></div>
    </div>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F">
      Nom
      <input type="text" value="Restaurant italien" style="height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 14px; font: inherit; font-size: 16px; color: #17201B">
    </label>

    <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F">
      Calories
      <span style="display: flex; align-items: center; height: 64px; border-radius: 14px; border: 1.5px solid #1E6B47; background: #FFFFFF; padding: 0 16px; gap: 8px">
        <input type="number" value="950" aria-label="Calories" style="border: none; outline: none; flex: 1; min-width: 0; font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 30px; color: #17201B; background: transparent">
        <span style="font-size: 15px; color: #5B655F">kcal</span>
      </span>
    </label>

    <div style="display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 8px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F">
        Protéines
        <span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 10px; gap: 4px"><input type="number" value="38" aria-label="Protéines en grammes" style="border: none; outline: none; width: 100%; min-width: 0; font: inherit; font-size: 16px; color: #17201B; background: transparent"><span>g</span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F">
        Glucides
        <span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 10px; gap: 4px"><input type="number" value="110" aria-label="Glucides en grammes" style="border: none; outline: none; width: 100%; min-width: 0; font: inherit; font-size: 16px; color: #17201B; background: transparent"><span>g</span></span>
      </label>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #5B655F">
        Lipides
        <span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #E1E4DC; background: #FFFFFF; padding: 0 10px; gap: 4px"><input type="number" value="38" aria-label="Lipides en grammes" style="border: none; outline: none; width: 100%; min-width: 0; font: inherit; font-size: 16px; color: #17201B; background: transparent"><span>g</span></span>
      </label>
    </div>

    <label style="display: flex; align-items: center; justify-content: space-between; height: 52px; border-radius: 12px; background: #FFFFFF; padding: 0 14px; font-size: 15px">
      <span>Heure</span>
      <input type="time" value="20:30" aria-label="Heure du repas" style="border: none; outline: none; font: inherit; color: #17201B; background: transparent">
    </label>

    <a href="mobile-1-aujourdhui.html" style="height: 54px; border-radius: 14px; background: #1E6B47; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">Ajouter à aujourd'hui</a>
    <a href="mobile-3a-nouveau-repas.html" style="text-align: center; font-size: 14px; font-weight: 600">Plutôt l'enregistrer dans Mes repas</a>
  </div>
</div>
</body>
</html>
