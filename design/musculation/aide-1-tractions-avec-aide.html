<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musculation – Tractions assistées</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5DBB8C}a:hover{color:#7FD0A7}
input::placeholder{color:#5E6862}
</style>
</head>
<body style="background:#0F1411">
<div style="width: 390px; height: 820px; box-sizing: border-box; background: #0F1411; color: #E8ECE8; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 14px">

  <div style="display: flex; align-items: center; gap: 8px">
    <a href="muscu-2-seance-liste.html" aria-label="Retour à la liste" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E8ECE8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-size: 13px; color: #9AA59F">Pull</div>
  </div>

  <a href="aide-3-fiche-tractions.html" style="display: flex; gap: 14px; align-items: center; color: #E8ECE8; text-decoration: none">
    <div style="width: 84px; height: 84px; flex-shrink: 0; border-radius: 14px; background: #1A211D; display: flex; align-items: center; justify-content: center; text-align: center; font-size: 11px; color: #7A847E">[Image]</div>
    <div style="display: flex; flex-direction: column; gap: 6px">
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 22px; line-height: 1.15">Tractions</div>
      <div style="font-size: 13px; color: #9AA59F">4 × 8–12</div>
    </div>
  </a>

  <div style="background: #1A211D; border-radius: 20px; padding: 12px 14px 14px; display: flex; flex-direction: column">
    <div style="display: flex; justify-content: flex-end">
      <div role="group" aria-label="Type de charge" style="display: flex; padding: 3px; border-radius: 10px; background: #0F1411; border: 1px solid #2C3530">
        <button aria-pressed="false" style="height: 30px; padding: 0 14px; border: none; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; background: transparent; color: #9AA59F">Lest</button>
        <button aria-pressed="true" style="height: 30px; padding: 0 14px; border: none; border-radius: 8px; font: inherit; font-size: 13px; font-weight: 600; background: #2C3530; color: #E8ECE8">Aide</button>
      </div>
    </div>
    <div style="display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; padding: 10px 0 6px; font-size: 12px; color: #9AA59F">
      <span></span><span>Objectif</span><span>Aide kg</span><span>Reps</span><span></span>
    </div>
    <div style="display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #252D28">
      <span style="font-weight: 600; color: #9AA59F">1</span>
      <span style="font-size: 13px; color: #9AA59F">20 × 10</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">20</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #5DBB8C">10</span>
      <button aria-label="Série 1 faite, modifier" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #5DBB8C; color: #0F1411; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #252D28">
      <span style="font-weight: 600; color: #9AA59F">2</span>
      <span style="font-size: 13px; color: #9AA59F">20 × 10</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">20</span>
      <span style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #F0955A">9</span>
      <button aria-label="Série 2 faite, modifier" style="width: 44px; height: 44px; border-radius: 12px; border: none; background: #5DBB8C; color: #0F1411; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #252D28">
      <span style="font-weight: 600">3</span>
      <span style="font-size: 13px; color: #E8ECE8">20 × 9</span>
      <label style="display: flex; align-items: center; height: 46px; border-radius: 12px; border: 1.5px solid #5DBB8C; background: #0F1411; padding: 0 10px"><input type="number" placeholder="20" aria-label="Aide série 3" style="width: 100%; min-width: 0; border: none; outline: none; background: transparent; color: #E8ECE8; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px"></label>
      <label style="display: flex; align-items: center; height: 46px; border-radius: 12px; border: 1.5px solid #5DBB8C; background: #0F1411; padding: 0 10px"><input type="number" placeholder="9" aria-label="Répétitions série 3" style="width: 100%; min-width: 0; border: none; outline: none; background: transparent; color: #E8ECE8; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px"></label>
      <button aria-label="Valider la série 3" style="width: 44px; height: 44px; border-radius: 12px; border: 1.5px solid #5DBB8C; background: transparent; color: #5DBB8C; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
    </div>
    <div style="display: grid; grid-template-columns: 22px 78px minmax(0, 1fr) minmax(0, 1fr) 44px; gap: 8px; align-items: center; padding: 6px 0; border-top: 1px solid #252D28; color: #7A847E">
      <span style="font-weight: 600">4</span>
      <span style="font-size: 13px">20 × 9</span>
      <span style="height: 46px; border-radius: 12px; border: 1px solid #2C3530; display: flex; align-items: center; padding: 0 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #5E6862">20</span>
      <span style="height: 46px; border-radius: 12px; border: 1px solid #2C3530; display: flex; align-items: center; padding: 0 10px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #5E6862">9</span>
      <button aria-label="Valider la série 4" style="width: 44px; height: 44px; border-radius: 12px; border: 1px solid #404B45; background: transparent; color: #7A847E; display: flex; align-items: center; justify-content: center"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"></path></svg></button>
    </div>
  </div>

  <div style="display: flex; justify-content: space-between; gap: 12px; font-size: 13px; color: #9AA59F; padding: 0 4px">
    <span>Dernière fois · jeu 8</span><span style="color: #E8ECE8">Aide 20 kg × 9 · 9 · 8 · 8</span>
  </div>

  <div style="display: flex">
    <button aria-pressed="false" aria-label="Facile, monter la charge la prochaine fois" style="height: 48px; padding: 0 18px; border-radius: 14px; border: 1.5px solid #2C3530; background: #1A211D; color: #E8ECE8; font: inherit; font-weight: 600; display: flex; align-items: center; gap: 8px"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M13 3L5 14h6l-1 7 8-11h-6l1-7z"></path></svg>Facile</button>
  </div>

  <a href="muscu-2-seance-liste.html" style="margin-top: auto; height: 54px; border-radius: 14px; background: #E8ECE8; color: #0F1411; font-weight: 600; font-size: 16px; display: flex; align-items: center; justify-content: center; text-decoration: none">Terminé</a>
</div>
</body>
</html>
