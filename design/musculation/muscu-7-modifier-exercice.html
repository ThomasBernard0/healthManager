<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Musculation – Modifier l'exercice</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5DBB8C}a:hover{color:#7FD0A7}
</style>
</head>
<body style="background:#0F1411">
<div style="width: 390px; height: 740px; box-sizing: border-box; background: #0F1411; color: #E8ECE8; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; padding: 12px 20px 24px; display: flex; flex-direction: column; gap: 16px">

  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="muscu-4-fiche-exercice.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E8ECE8">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 17px">Exercice</div>
    <div style="width: 44px"></div>
  </div>

  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9AA59F">
    Nom
    <input type="text" value="Rowing barre" style="height: 48px; border-radius: 12px; border: 1px solid #2C3530; background: #1A211D; padding: 0 14px; font: inherit; font-size: 16px; color: #E8ECE8">
  </label>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #9AA59F">Séries et répétitions</div>
    <div style="display: flex; align-items: flex-end; gap: 10px">
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9AA59F; flex: 1; min-width: 0">Séries<input type="number" value="4" aria-label="Nombre de séries" style="height: 48px; border-radius: 12px; border: 1px solid #2C3530; background: #1A211D; padding: 0 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #E8ECE8; width: 100%; box-sizing: border-box"></label>
      <span style="height: 48px; display: flex; align-items: center; color: #9AA59F">×</span>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9AA59F; flex: 1; min-width: 0">Min<input type="number" value="8" aria-label="Répétitions minimum" style="height: 48px; border-radius: 12px; border: 1px solid #2C3530; background: #1A211D; padding: 0 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #E8ECE8; width: 100%; box-sizing: border-box"></label>
      <span style="height: 48px; display: flex; align-items: center; color: #9AA59F">–</span>
      <label style="display: flex; flex-direction: column; gap: 6px; font-size: 12px; color: #9AA59F; flex: 1; min-width: 0">Max<input type="number" value="12" aria-label="Répétitions maximum" style="height: 48px; border-radius: 12px; border: 1px solid #2C3530; background: #1A211D; padding: 0 12px; font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px; color: #E8ECE8; width: 100%; box-sizing: border-box"></label>
    </div>
  </div>

  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #9AA59F">Muscles</div>
    <div style="display: flex; flex-wrap: wrap; gap: 6px">
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: none; background: #5DBB8C; color: #0F1411; font-weight: 600; font-size: 13px">Dos</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #5DBB8C; background: transparent; color: #E8ECE8; font-size: 13px">Biceps</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #5DBB8C; background: transparent; color: #E8ECE8; font-size: 13px">Arrière d'épaule</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2C3530; background: transparent; color: #9AA59F; font-size: 13px">Pectoraux</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2C3530; background: transparent; color: #9AA59F; font-size: 13px">Triceps</button>
      <button style="height: 36px; padding: 0 14px; border-radius: 999px; border: 1px solid #2C3530; background: transparent; color: #9AA59F; font-size: 13px">+</button>
    </div>
    <div style="display: flex; gap: 16px; font-size: 12px; color: #9AA59F">
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 999px; background: #5DBB8C"></span>Principal</span>
      <span style="display: flex; align-items: center; gap: 6px"><span style="width: 12px; height: 12px; border-radius: 999px; border: 1.5px solid #5DBB8C; box-sizing: border-box"></span>Secondaire</span>
    </div>
  </div>


  <div style="display: flex; flex-direction: column; gap: 8px">
    <div style="font-size: 13px; color: #9AA59F">Image</div>
    <div style="display: flex; align-items: center; gap: 12px">
      <div style="width: 64px; height: 64px; border-radius: 12px; background: #1A211D"></div>
      <button style="height: 40px; padding: 0 14px; border-radius: 10px; border: 1px solid #2C3530; background: transparent; color: #E8ECE8; font-size: 14px">Changer</button>
    </div>
  </div>

  <a href="muscu-4-fiche-exercice.html" style="margin-top: auto; height: 54px; border-radius: 14px; background: #5DBB8C; color: #0F1411; display: flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">Enregistrer</a>
</div>
</body>
</html>
