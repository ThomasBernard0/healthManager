<!doctype html>
<html lang="fr">
<head>

<title>Finances – Modifier une ligne</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#5DBB8C}a:hover{color:#7FD0A7}

</style>
</head>
<body style="background:#0F1411">
<div style="width: 390px; height: 760px; box-sizing: border-box; background: rgba(0,0,0,0.55); font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; color: #E8ECE8; display: flex; flex-direction: column; justify-content: flex-end">
<div style="background: #141A16; border-radius: 24px 24px 0 0; padding: 10px 20px 28px; display: flex; flex-direction: column; gap: 14px">
  <div style="align-self: center; width: 40px; height: 4px; border-radius: 2px; background: #404B45"></div>
  <div style="display: flex; align-items: center; justify-content: space-between">
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Modifier</div>
    <a href="mobile-1-mon-mois.html" aria-label="Fermer" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #E8ECE8"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"></path></svg></a>
  </div>
  <div role="group" aria-label="Type" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 4px; padding: 4px; border-radius: 12px; background: #0F1411; border: 1px solid #2C3530">
    <button aria-pressed="true" style="height: 38px; border: none; border-radius: 9px; font: inherit; font-size: 14px; background: #2C3530; color: #E8ECE8; font-weight: 600">Dépense</button>
    <button aria-pressed="false" style="height: 38px; border: none; border-radius: 9px; font: inherit; font-size: 14px; background: transparent; color: #9AA59F">Entrée</button>
  </div>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9AA59F; min-width: 0">Nom<input type="text" value="Netflix" style="height: 48px; border-radius: 12px; border: 1px solid #2C3530; background: #1A211D; padding: 0 14px; font: inherit; font-size: 16px; color: #E8ECE8; box-sizing: border-box; width: 100%; min-width: 0"></label>
  <label style="display: flex; flex-direction: column; gap: 6px; font-size: 13px; color: #9AA59F; min-width: 0">Montant<span style="display: flex; align-items: center; height: 48px; border-radius: 12px; border: 1px solid #2C3530; background: #1A211D; padding: 0 12px; gap: 6px"><input inputmode="decimal" aria-label="Montant" value="13" style="flex: 1; min-width: 0; border: none; outline: none; background: transparent; font: inherit; font-size: 16px; color: #E8ECE8"><span style="color: #9AA59F">€</span></span></label>

  <button style="height: 52px; border-radius: 14px; border: none; background: #5DBB8C; color: #0F1411; font: inherit; font-weight: 600; font-size: 16px; margin-top: 4px">Enregistrer</button>
  <button style="height: 44px; border-radius: 12px; border: none; background: transparent; color: #E58E73; font: inherit; font-weight: 600; font-size: 14px">Supprimer</button>

</div>
