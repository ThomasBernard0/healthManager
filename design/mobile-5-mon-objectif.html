<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Alimentation – Mon objectif</title>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&amp;family=Space+Grotesk:wght@500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
a{color:#1E6B47}a:hover{color:#14492F}
</style>
</head>
<body style="background:#E6E8E1">
<div style="width: 390px; height: 720px; box-sizing: border-box; background: #F3F4EF; color: #17201B; font-family: 'IBM Plex Sans', system-ui, sans-serif; font-size: 15px; display: flex; flex-direction: column; gap: 14px; padding: 16px 20px 24px">
  <div style="display: flex; align-items: center; justify-content: space-between">
    <a href="mobile-1-aujourdhui.html" aria-label="Retour" style="width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; color: #17201B">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 600; font-size: 18px">Mon objectif</div>
    <div style="width: 44px"></div>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 18px; display: flex; flex-direction: column; gap: 14px">
    <div style="font-size: 13px; color: #5B655F">Calories par jour</div>
    <div style="display: flex; align-items: center; justify-content: space-between; border: 1px solid #E1E4DC; border-radius: 14px">
      <button aria-label="Diminuer de 50 kcal" style="width: 56px; height: 56px; border: none; background: transparent; font: inherit; font-size: 22px; color: #17201B">−</button>
      <div style="font-family: 'Space Grotesk', sans-serif; font-weight: 700; font-size: 28px">2 400 <span style="font-size: 15px; font-weight: 500; color: #5B655F">kcal</span></div>
      <button aria-label="Augmenter de 50 kcal" style="width: 56px; height: 56px; border: none; background: transparent; font: inherit; font-size: 22px; color: #17201B">+</button>
    </div>
    <div aria-hidden="true" style="display: flex; height: 10px; border-radius: 5px; overflow: hidden; background: #E6E8E1">
      <div style="width: 26.7%; background: #2F5D8A"></div>
      <div style="width: 43.3%; background: #C98A1B"></div>
      <div style="width: 30.0%; background: #7A4E91"></div>
    </div>
  </div>

  <div style="background: #FFFFFF; border-radius: 20px; padding: 6px 18px; display: flex; flex-direction: column">
    <label style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid #EEF0EA">
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #2F5D8A"></span>Protéines</span>
      <span style="display: flex; align-items: center; gap: 6px"><input type="number" value="160" aria-label="Protéines par jour" style="width: 76px; height: 44px; border: 1px solid #E1E4DC; border-radius: 10px; text-align: right; padding: 0 10px; font: inherit; box-sizing: border-box"><span style="color: #5B655F; width: 14px">g</span></span>
    </label>
    <label style="display: flex; align-items: center; justify-content: space-between; min-height: 56px; border-bottom: 1px solid #EEF0EA">
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #7A4E91"></span>Lipides</span>
      <span style="display: flex; align-items: center; gap: 6px"><input type="number" value="80" aria-label="Lipides par jour" style="width: 76px; height: 44px; border: 1px solid #E1E4DC; border-radius: 10px; text-align: right; padding: 0 10px; font: inherit; box-sizing: border-box"><span style="color: #5B655F; width: 14px">g</span></span>
    </label>
    <div style="display: flex; align-items: center; justify-content: space-between; min-height: 56px">
      <span style="display: flex; align-items: center; gap: 8px"><span style="width: 10px; height: 10px; border-radius: 3px; background: #C98A1B"></span>Glucides</span>
      <span style="display: flex; align-items: center; gap: 6px"><span aria-label="Glucides par jour, calculés" style="width: 76px; height: 44px; border-radius: 10px; background: #F3F4EF; display: flex; align-items: center; justify-content: flex-end; padding: 0 10px; box-sizing: border-box; font-weight: 600; color: #17201B">260</span><span style="color: #5B655F; width: 14px">g</span></span>
    </div>
  </div>

  <a href="mobile-1-aujourdhui.html" style="height: 54px; border-radius: 14px; background: #1E6B47; color: #FFFFFF; display: flex; align-items: center; justify-content: center; font-weight: 600; text-decoration: none">Enregistrer</a>
</div>
</body>
</html>
